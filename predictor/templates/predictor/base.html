<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Grade Predictor</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}
header{background:#17365d;color:white;padding:20px 6%}main{max-width:900px;margin:28px auto;padding:0 18px}
.card{background:white;padding:24px;border-radius:12px;box-shadow:0 3px 16px #0001;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-weight:bold;margin-bottom:6px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd4df;border-radius:6px}
button,.nav{display:inline-block;background:#1769aa;color:white;border:0;border-radius:6px;padding:12px 18px;text-decoration:none;cursor:pointer;margin-top:14px}
.errorlist{color:#a00}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}
.small{color:#526174;font-size:.92rem}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><header><h1>Student Grade Prediction</h1><div>Academic support tool · Django local demo</div></header>
<main>{% block content %}{% endblock %}</main></body></html>
